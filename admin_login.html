<!DOCTYPE html>
<html lang="bn">
<head>
    <title>Admin Login - ChainHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #f4f7f6; height: 100vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow-lg border-0" style="border-radius: 15px;">
                <h3 class="text-center fw-bold text-primary mb-4">Admin Access</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="fw-bold">ইমেইল ঠিকানা</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="fw-bold">পাসওয়ার্ড</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100 fw-bold">লগইন করুন</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
