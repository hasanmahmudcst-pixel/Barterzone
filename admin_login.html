<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Barterzone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        .footer-text { text-align: center; margin-top: 20px; font-size: 14px; color: #777; }
        .footer-text a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>অ্যাডমিন লগইন</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="username">ইউজারনেম</label>
            <input type="text" id="username" name="username" placeholder="আপনার ইউজারনেম দিন" required>
        </div>
        <div class="form-group">
            <label for="password">পাসওয়ার্ড</label>
            <input type="password" id="password" name="password" placeholder="আপনার পাসওয়ার্ড দিন" required>
        </div>
        <button type="submit">লগইন করুন</button>
    </form>
    <div class="footer-text">
        <p><a href="/">হোম পেজে ফিরে যান</a></p>
    </div>
</div>

</body>
</html>
