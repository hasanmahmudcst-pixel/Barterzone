<!DOCTYPE html>
<html>
<head><style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #2c3e50; font-family: sans-serif; }
    .card { background: white; padding: 40px; border-radius: 10px; text-align: center; }
    input { display: block; width: 250px; padding: 10px; margin: 15px 0; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 30px; cursor: pointer; }
</style></head>
<body>
    <div class="card">
        <h2>Admin Login</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="Admin Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
