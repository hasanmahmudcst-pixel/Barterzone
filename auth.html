<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - ChainHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-primary d-flex align-items-center" style="height: 100vh;">
    <div class="card shadow border-0 p-4 mx-auto" style="max-width: 400px; width: 90%;">
        <h3 class="text-center mb-4 fw-bold">ChainHub Login</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobile" class="form-control" placeholder="017..." required>
            </div>
            <div class="mb-4">
                <label class="form-label">NID Number</label>
                <input type="text" name="nid" class="form-control" placeholder="Your NID Number" required>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold">Enter</button>
        </form>
    </div>
</body>
</html>
