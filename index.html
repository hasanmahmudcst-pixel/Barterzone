<!DOCTYPE html>
<html>
<head><title>BarterZone</title></head>
<body>
    <nav>
        <a href="/">Home</a> | <a href="/login">Login</a> | <a href="/add_item">Add Product</a>
    </nav>
    <h1>Welcome to BarterZone</h1>
    <div id="item-list">
        {% for p in products %}
            <div style="border:1px solid #ddd; padding:10px; margin:5px;">
                <h3>{{ p.name }} - {{ p.price }} TK</h3>
            </div>
        {% endfor %}
    </div>
    <hr>
    <h4>About Us</h4>
    <p>{{ settings.about }}</p>
    <h4>Refund Policy</h4>
    <p>{{ settings.refund }}</p>
</body>
</html>
