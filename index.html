<!DOCTYPE html>
<html>
<head>
    <title>BarterZone</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; }
        .nav { background: #1a73e8; padding: 15px; text-align: center; color: white; }
        .nav a { color: white; text-decoration: none; margin: 0 15px; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; }
        .footer { background: #eef2f3; padding: 20px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a> | <a href="/add_item">Add Item</a> | <a href="/login">Admin</a>
    </div>
    <div class="container">
        <h1>Marketplace</h1>
        {% for p in products %}
        <p><b>{{ p.name }}</b> - {{ p.price }} TK</p>
        {% endfor %}

        <div class="footer">
            <h3>About Us</h3>
            <p>{{ settings.about }}</p>
            <hr>
            <h3>Refund Policy</h3>
            <p>{{ settings.refund }}</p>
        </div>
    </div>
</body>
</html>
