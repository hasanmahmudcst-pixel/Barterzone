<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChainHub - Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">ChainHub</a>
            <div>
                {% if session.user %}
                    <a href="/add" class="btn btn-warning btn-sm">Product Upload</a>
                    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
                {% else %}
                    <a href="/auth" class="btn btn-light btn-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        <form action="/" method="get" class="mb-4 d-flex">
            <input type="text" name="search" class="form-control me-2" placeholder="What are you looking for?">
            <button class="btn btn-primary px-4">Search</button>
        </form>
        <div class="row">
            {% for item in items %}
            <div class="col-md-4">
                <div class="card mb-4 shadow-sm h-100 border-0">
                    <div class="card-header bg-dark text-white fw-bold">{{ item.name }}</div>
                    <div class="card-body">
                        <p class="card-text">{{ item.desc }}</p>
                        <p class="text-success mb-1"><strong>In barter for:</strong> {{ item.exchange }}</p>
                        <hr>
                        <small class="text-muted">Owner: {{ item.owner }}</small>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
