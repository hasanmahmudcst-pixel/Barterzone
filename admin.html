<div style="padding: 20px;">
    <h1>অ্যাডমিন প্যানেল</h1>
    <a href="/logout">লগআউট</a>
    <hr>
    
    <h3>ইউজারদের পাঠানো পণ্যের তালিকা:</h3>
    <table border="1" cellpadding="10" style="width:100%; border-collapse: collapse;">
        <tr style="background: #eee;">
            <th>পণ্যের নাম</th>
            <th>ইউজার ইমেইল</th>
            <th>TrxID</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.trxid }}</td>
        </tr>
        {% endfor %}
    </table>

    <hr>
    <h3>সাইট সেটিংস আপডেট করুন:</h3>
    <form method="POST">
        <p>About Us:</p>
        <textarea name="about_text" rows="5" style="width:100%;">{{ settings.about }}</textarea>
        <p>Refund Policy:</p>
        <textarea name="refund_text" rows="5" style="width:100%;">{{ settings.refund }}</textarea><br><br>
        <button type="submit">Update Website</button>
    </form>
</div>
