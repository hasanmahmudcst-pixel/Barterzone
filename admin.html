<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Barterzone</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #d9534f; color: white; }
        .trx-style { font-family: monospace; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>অ্যাডমিন প্যানেল (পেমেন্ট চেক করুন)</h1>
        <table>
            <thead>
                <tr>
                    <th>পণ্যের নাম</th>
                    <th>বিনিময়ে যা চান</th>
                    <th>Transaction ID</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>{{ item.exchange }}</td>
                    <td class="trx-style">{{ item.trxid }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/">হোম পেজ</a>
    </div>
</body>
</html>
