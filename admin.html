<!DOCTYPE html>
<html>
<body>
    <h2>Admin Dashboard</h2>
    <form method="POST" style="border:1px solid #ccc; padding:15px;">
        <h3>Update Site Content</h3>
        <label>About Us:</label><br>
        <textarea name="about" rows="3" style="width:100%">{{ settings.about }}</textarea><br><br>
        <label>Refund Policy:</label><br>
        <textarea name="refund" rows="3" style="width:100%">{{ settings.refund }}</textarea><br><br>
        <button type="submit">Update Site Info</button>
    </form>
    <hr>
    <h3>All Submitted Products</h3>
    <table border="1">
        <tr><th>Name</th><th>Trx ID</th><th>Status</th></tr>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.trx_id }}</td>
            <td>{{ p.status }}</td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/logout">Logout</a>
</body>
</html>
